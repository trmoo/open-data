  공공데이터 수집 기록장 — 판정 엔진

  ⚠ 이 파일도 node 로 그대로 불러다 시험한다. DOM 을 만들지 말 것.
  ⚠ 여기 있는 판정은 모두 **규칙**이다. 사람처럼 읽지 못한다.
     그래서 화면에서는 「채점」이 아니라 「자기 점검」이라고 부르고,
     최종 확인은 교사가 서술 원문과 실제 링크를 보고 한다.

<script>

/* ══════════════════════════════════════════════════════════
   한국어 조사 — 데이터 이름·사이트 이름이 자료에서 오므로 문장을 미리 못 정한다
   ⚠ 「마이크로비트」의 「트」처럼 초성이 거세도 받침이 없으면 「가」이다.
     숫자·알파벳은 읽는 소리로 판단한다.
   ══════════════════════════════════════════════════════════ */
var JOSA = (function () {
  /* 알파벳 한 글자를 우리말로 읽었을 때 받침이 있는가 */
  var ALPHA_JONG = { l: true, m: true, n: true, r: true };   /* 엘·엠·엔·아르 */
  /* 숫자를 읽었을 때 받침이 있는가 — 일(ㄹ) 삼(ㅁ) 육(ㄱ) 칠(ㄹ) 팔(ㄹ) 십(ㅂ) */
  var NUM_JONG = { '0': false, '1': true, '2': false, '3': true, '4': false,
                   '5': false, '6': true, '7': true, '8': true, '9': false };

  /** 마지막 글자에 받침이 있는가 */
  function hasJong(word) {
    var s = String(word == null ? '' : word).replace(/[\s.,!?"'()\[\]「」『』·…-]+$/, '');
    if (!s) return false;
    var c = s.charAt(s.length - 1);
    var code = c.charCodeAt(0);
    if (code >= 0xac00 && code <= 0xd7a3) return ((code - 0xac00) % 28) !== 0;
    if (c >= '0' && c <= '9') return NUM_JONG[c];
    var low = c.toLowerCase();
    if (low >= 'a' && low <= 'z') return !!ALPHA_JONG[low];
    return false;   /* 알 수 없으면 받침 없는 쪽으로 (「는·가·를」) */
  }

  function pick(word, withJong, without) {
    return String(word) + (hasJong(word) ? withJong : without);
  }

  /* 「…」 안에 이름을 넣을 때는 조사가 따옴표 **밖**에 붙어야 한다.
     그때 쓰라고 조사만 돌려주는 함수를 따로 둔다 — 「SK 빅데이터 허브」 + 는 */
  var ONLY = { eun: ['은', '는'], i: ['이', '가'], eul: ['을', '를'], wa: ['과', '와'] };

  var api = {
    hasJong: hasJong,
    eun: function (w) { return pick(w, '은', '는'); },
    i:   function (w) { return pick(w, '이', '가'); },
    eul: function (w) { return pick(w, '을', '를'); },
    wa:  function (w) { return pick(w, '과', '와'); },
    /** ~로 / ~으로 — ㄹ 받침이면 「로」 */
    ro: function (w) {
      var s = String(w == null ? '' : w);
      var c = s.charAt(s.length - 1);
      var code = c.charCodeAt(0);
      if (code >= 0xac00 && code <= 0xd7a3 && ((code - 0xac00) % 28) === 8) return s + '로';
      return pick(w, '으로', '로');
    },
    /** 조사만 돌려준다. only('CSV','eun') → '는' */
    only: function (w, kind) {
      var pair = ONLY[kind] || ONLY.eun;
      return hasJong(w) ? pair[0] : pair[1];
    }
  };
  return api;
})();

/* ══════════════════════════════════════════════════════════
   판정 엔진
   ══════════════════════════════════════════════════════════ */
var JUDGE = (function () {

  /* ── 글자 수 ─────────────────────────────────────────── */
  function len(v) {
    return String(v == null ? '' : v).replace(/\s/g, '').length;
  }

  /* ── 뭉뚱그린 표현 찾기 ───────────────────────────────── */
  function vague(v) {
    var s = String(v == null ? '' : v);
    var found = [];
    (DATA.vagueWords || []).forEach(function (w) {
      if (s.indexOf(w) >= 0 && found.indexOf(w) < 0) found.push(w);
    });
    return found;
  }

  /* ── 출처 링크 점검 ───────────────────────────────────
     level: 'ok' 좋음 · 'warn' 고치면 더 좋음 · 'bad' 이대로는 안 됨
     ⚠ 사람이 열어 보는 것을 대신하지 못한다. 「모양」만 본다.
     ───────────────────────────────────────────────────── */
  function url(v) {
    var raw = String(v == null ? '' : v).trim();
    var out = { level: 'bad', host: '', msgs: [], site: null };
    if (!raw) { out.msgs.push('출처 링크가 비어 있습니다.'); return out; }

    /* 주소 뒤에 설명을 덧붙인 경우가 잦다 — 첫 덩어리만 주소로 본다 */
    var first = raw.split(/\s+/)[0];
    if (first !== raw) {
      out.msgs.push('주소 뒤에 다른 글이 붙어 있습니다. 앞의 주소만 보고 판단했습니다.');
    }

    var m = first.match(/^([a-zA-Z][a-zA-Z0-9+.-]*):\/\//);
    var scheme = m ? m[1].toLowerCase() : '';
    var rest = m ? first.substring(m[0].length) : first;

    if (scheme === 'file') {
      out.msgs.push('내 컴퓨터 안의 파일 경로입니다. 다른 사람은 열 수 없습니다.');
      return out;
    }
    if (!scheme) {
      out.msgs.push('앞에 https:// 를 붙여 주세요. 그래야 눌러서 열 수 있는 주소가 됩니다.');
    } else if (scheme !== 'http' && scheme !== 'https') {
      out.msgs.push('웹 주소가 아닙니다 (' + scheme + '). https:// 로 시작하는 주소를 붙여 주세요.');
      return out;
    }

    var host = rest.split('/')[0].split('?')[0].split('#')[0].toLowerCase();
    host = host.replace(/^www\./, '');
    out.host = host;
    if (!host || host.indexOf('.') < 0) {
      out.msgs.push('주소처럼 보이지 않습니다. 데이터 페이지에서 주소 표시줄을 그대로 복사해 붙여 주세요.');
      return out;
    }
    if (host === 'localhost' || /^\d+\.\d+\.\d+\.\d+$/.test(host)) {
      out.msgs.push('내 컴퓨터를 가리키는 주소입니다. 다른 사람은 열 수 없습니다.');
      return out;
    }

    /* 문을 닫았거나 남에게 넘어간 주소인가 */
    var dead = null;
    (DATA.deadSites || []).forEach(function (d) {
      if (host === d.addr || host.indexOf(d.addr) >= 0) dead = d;
    });
    if (dead) {
      if (dead.level === 'moved') {
        out.level = 'warn';
        out.msgs.push('「' + dead.name + '」 의 옛 주소입니다. 새 주소로 바꾸어 적어 주세요.');
        return out;
      }
      out.msgs.push('⚠ 「' + dead.name + '」' + JOSA.only(dead.name, 'eun') +
                    ' 지금 그 서비스가 아닙니다. 다른 데이터를 찾아 주세요.');
      return out;
    }

    /* 아는 사이트인가 */
    (DATA.sites || []).forEach(function (s) {
      var h = String(s.url).replace(/^https?:\/\//, '').replace(/^www\./, '').split('/')[0].toLowerCase();
      if (host === h || host.indexOf(h) >= 0 || h.indexOf(host) >= 0) out.site = s;
    });

    var low = first.toLowerCase();
    var warned = false;

    if (/[?&](query|keyword|search|keywd|q)=/.test(low) || /\/search/.test(low)) {
      out.msgs.push('검색 결과 주소로 보입니다. 검색 결과가 아니라 **데이터 상세 페이지** 주소를 붙여 주세요.');
      warned = true;
    }
    if (/\.(csv|xlsx?|zip|json|xml|hwp|pdf)(\?|$)/.test(low)) {
      out.msgs.push('파일을 바로 내려받는 주소입니다. 데이터 상세 페이지 주소가 더 좋습니다 ' +
                    '(설명과 이용 조건을 함께 볼 수 있으니까요).');
      warned = true;
    }
    if (/[가-힣]/.test(first)) {
      out.msgs.push('주소에 한글이 들어 있습니다. 주소 표시줄에서 복사하면 %EA%B0%80 같은 모양으로 바뀝니다. ' +
                    '그대로 붙여도 됩니다.');
      warned = true;
    }
    if (scheme === 'http') {
      out.msgs.push('http:// 입니다. 같은 사이트의 https:// 주소가 있으면 그쪽을 쓰세요.');
      warned = true;
    }

    out.level = warned || !scheme ? 'warn' : 'ok';
    if (out.site) {
      out.msgs.unshift('「' + out.site.name + '」 의 주소로 보입니다.');
      if (!warned && scheme) out.level = 'ok';
    } else if (out.level === 'ok') {
      out.msgs.push('열 수 있는 주소 모양입니다. 이 앱이 아는 사이트는 아니니, ' +
                    '**누가 만든 데이터인지** 꼭 확인하세요.');
    }
    return out;
  }

  /* ── 파일 형식으로 데이터 형태 짐작하기 ───────────────── */
  function guessType(text) {
    var s = String(text == null ? '' : text).toLowerCase();
    if (!s.replace(/\s/g, '')) return null;
    var hit = null;
    (DATA.extMap || []).forEach(function (e) {
      if (hit) return;
      if (s.indexOf(String(e.pat).toLowerCase()) >= 0) hit = e;
    });
    return hit ? { type: hit.type, why: hit.why } : null;
  }

  /** 고른 형태와 적은 형식이 어긋나는가 */
  function typeMismatch(dtype, dformat) {
    var g = guessType(dformat);
    if (!g || !dtype) return null;
    if (String(dtype).indexOf(g.type) >= 0) return null;
    /* API 로 받아 JSON 으로 오는 경우는 어긋난 것이 아니다 — 둘 다 맞다 */
    if (g.type === '반정형' && String(dtype).indexOf('동적') >= 0) return null;
    if (g.type === '동적' && String(dtype).indexOf('반정형') >= 0) return null;
    return { picked: dtype, guess: g.type, why: g.why };
  }

  /* ── 고른 형태에 맞는 속성 표 안내 고르기 ──────────────
     ⚠⚠ 「반정형」·「비정형」 은 「정형」 을 글자로 품는다. 그래서 열쇠를 짧은 것부터
       맞춰 보면 넷 다 「정형」 으로 걸려, 반정형을 골라도 정형 안내가 나온다.
       **반드시 긴 열쇠부터** 맞춰야 한다. (2026-09-04 실제로 그 버그가 있었다)
     ───────────────────────────────────────────────────── */
  /**
   * 속성 표(⑦-3)를 물어야 하는가 — **정형 데이터일 때만** 묻는다 (2026-09-04 사용자 지시).
   * ⚠⚠ 「반정형」·「비정형」 이 「정형」 을 글자로 품으므로 그 둘을 **먼저** 걸러야 한다.
   * ⚠ 서버 쪽 isStructured_() 와 판정이 늘 같아야 한다. 시험이 둘을 맞대어 본다.
   */
  function needsAttrs(dtype) {
    var t = String(dtype == null ? '' : dtype);
    if (!t.replace(/\s/g, '')) return true;      /* 아직 안 골랐으면 보여 준다 */
    if (t.indexOf('반정형') >= 0 || t.indexOf('비정형') >= 0 || t.indexOf('동적') >= 0) return false;
    return true;
  }

  function attrPromptOf(dtype) {
    var map = (typeof DATA !== 'undefined' && DATA.attrPrompt) || {};
    var s = String(dtype == null ? '' : dtype);
    var keys = Object.keys(map).sort(function (a, b) { return b.length - a.length; });
    for (var i = 0; i < keys.length; i++) {
      if (s.indexOf(keys[i]) >= 0) {
        return { type: keys[i], ask: map[keys[i]].ask, head: map[keys[i]].head,
                 what: map[keys[i]].what, ph: map[keys[i]].ph };
      }
    }
    var d = map['정형'] || {};
    return { type: '정형', ask: d.ask, head: d.head, what: d.what, ph: d.ph, guessed: true };
  }

  /* ── 속성 표 ─────────────────────────────────────────
     표(구조)를 한 줄 글로 바꾸어 시트 한 칸에 담는다.
     rows = [{name, type, desc, ex}]
     ───────────────────────────────────────────────────── */
  function attrText(rows) {
    var out = [];
    (rows || []).forEach(function (r) {
      var name = String((r && r.name) || '').trim();
      if (!name) return;
      var t = String((r && r.type) || '').trim();
      var d = String((r && r.desc) || '').trim();
      var one = name + (t ? '(' + t + ')' : '');
      if (d) one += ' — ' + d;
      out.push(one);
    });
    return out.join(' · ');
  }

  /** 이름이 적힌 줄 수 */
  function attrCount(rows) {
    var n = 0;
    (rows || []).forEach(function (r) {
      if (String((r && r.name) || '').trim()) n++;
    });
    return n;
  }

  /* ── 데이터의 규모 점검 ───────────────────────────────
     「몇 건 · 언제 · 어디」 세 가지를 적었는지 본다.
     ───────────────────────────────────────────────────── */
  function scaleBadges(v) {
    var s = String(v == null ? '' : v);
    return [
      { key: 'howmany', name: '얼마나',
        ok: /[0-9]/.test(s) && /(건|행|줄|개|명|장|만|천|백)/.test(s),
        hint: '몇 건(행)인지 숫자로 적어 보세요. 예: 약 4만 행' },
      { key: 'when', name: '언제',
        ok: /(19|20)\d{2}/.test(s) || /(년|월|분기|기준|최근|현재)/.test(s),
        hint: '언제 자료인지 적어 보세요. 예: 2025년 기준' },
      { key: 'where', name: '어디',
        ok: /(전국|전세계|전 세계|시|도|군|구|읍|면|동|지역|학교|서울|경기|부산|대구|인천|광주|대전|울산|세종|강원|충청|전라|경상|제주)/.test(s),
        hint: '어느 범위인지 적어 보세요. 예: 전국 / 서울시 / 우리 학교' }
    ];
  }

  /* ── 「해결할 수 있는 문제」 점검 ─────────────────────── */
  function problemBadges(v) {
    var s = String(v == null ? '' : v);
    return [
      { key: 'long', name: '충분한 길이',
        ok: len(s) >= 80,
        hint: '80자 이상 적어 보세요. 문제 하나를 끝까지 설명하면 자연히 넘습니다.' },
      { key: 'use', name: '어떤 값을 볼지',
        ok: /(값|열|속성|항목|수|건수|평균|비율|개수|농도|기온|거리|시각|시간대|위도|경도)/.test(s),
        hint: '데이터 안의 **어떤 값**을 보면 답이 나오는지 적어 보세요.' },
      { key: 'who', name: '누구에게 쓸모 있나',
        ok: /(학생|학교|우리|주민|시민|선생님|가족|이용자|사람들|친구)/.test(s),
        hint: '이 답이 누구에게 쓸모 있는지 한마디 넣어 보세요.' },
      { key: 'limit', name: '알 수 없는 것도 밝혔나',
        ok: /(없|못|어렵|한계|다만|부족|알 수 없|말할 수 없|더 필요)/.test(s),
        hint: '이 데이터만으로는 알 수 없는 것도 한 문장 적으면 훨씬 좋은 답이 됩니다.' }
    ];
  }

  /* ── 「수집한 이유」 점검 ─────────────────────────────── */
  function whyBadges(v) {
    var s = String(v == null ? '' : v);
    return [
      { key: 'long', name: '충분한 길이',
        ok: len(s) >= 60,
        hint: '60자 이상 적어 보세요.' },
      { key: 'link', name: '데이터와 이어졌나',
        ok: /(들어 ?있|담겨|있어서|있으므로|나와 ?있|포함|적혀)/.test(s),
        hint: '「이 데이터에 ○○가 들어 있어서」처럼 데이터의 내용과 이어 주세요.' },
      { key: 'noVague', name: '뭉뚱그리지 않았나',
        ok: vague(s).length === 0 && len(s) > 0,
        hint: '「그냥」·「관심이 있어서」 같은 말만으로는 이유가 되지 않습니다.' }
    ];
  }

  /* ── 마지막 점검 목록 (report 화면) ───────────────────
     vals   : 서술 칸 값
     info   : { fields, acts, scores, attrRows }
     돌려주는 것: [{ok, must, text, hint, screen}]
     ───────────────────────────────────────────────────── */
  function checklist(vals, info) {
    vals = vals || {};
    info = info || {};
    var fields = info.fields || [];
    var acts = info.acts || [];
    var scores = info.scores || {};
    var list = [];

    function get(k) { return String(vals[k] == null ? '' : vals[k]); }

    /* 1. 빈 칸 */
    var empty = fields.filter(function (f) { return len(get(f.key)) === 0; });
    list.push({
      ok: empty.length === 0, must: true,
      text: '모든 칸을 채웠는가',
      hint: empty.length
        ? '아직 빈 칸 ' + empty.length + '개 — ' + empty.map(function (f) { return f.no + ' ' + f.title; }).join(', ')
        : '빈 칸이 없습니다.',
      screen: empty.length ? screenOf(empty[0].key, info) : null
    });

    /* 2. 기준 글자 수 */
    var short = fields.filter(function (f) {
      var n = len(get(f.key));
      return n > 0 && n < f.min;
    });
    list.push({
      ok: short.length === 0, must: false,
      text: '길게 써야 하는 칸을 충분히 썼는가',
      hint: short.length
        ? '조금 더 쓰면 좋은 칸 — ' + short.map(function (f) { return f.no + ' ' + f.title + '(' + len(get(f.key)) + '/' + f.min + '자)'; }).join(', ')
        : '모두 기준을 넘겼습니다.',
      screen: short.length ? screenOf(short[0].key, info) : null
    });

    /* 3. 링크 */
    var u = url(get('source_url'));
    list.push({
      ok: u.level === 'ok', must: true,
      text: '출처 링크가 다른 사람도 열 수 있는 주소인가',
      hint: u.msgs.length ? u.msgs[0] : '좋습니다.',
      screen: 'source'
    });

    /* 4. 이용 조건 */
    var lic = get('license');
    list.push({
      ok: len(lic) > 0 && lic.indexOf('확인하지 못함') < 0, must: true,
      text: '이용 조건(저작권)을 확인했는가',
      hint: lic.indexOf('확인하지 못함') >= 0
        ? '데이터 상세 페이지의 「이용허락범위」를 찾아 적어 주세요.'
        : (len(lic) ? '확인했습니다: ' + lic : '아직 고르지 않았습니다.'),
      screen: 'source'
    });

    /* 5. 형태와 형식 */
    var mis = typeMismatch(get('dtype'), get('dformat'));
    list.push({
      ok: len(get('dtype')) > 0 && !mis, must: false,
      text: '데이터 형태와 파일 형식이 서로 맞는가',
      hint: mis
        ? '「' + mis.picked + '」' + JOSA.only(mis.picked, 'eul') + ' 골랐는데 형식은 ' +
          mis.guess + ' 쪽으로 보입니다. ' + mis.why
        : (len(get('dtype')) ? '맞습니다.' : '아직 형태를 고르지 않았습니다.'),
      screen: 'type'
    });

    /* 6. 속성 — 정형 데이터일 때만 묻는 칸이므로, 아닐 때는 항목 자체를 넣지 않는다.
          (넣어 두면 비정형을 고른 학생에게 영영 못 지우는 △ 가 남는다) */
    if (needsAttrs(get('dtype'))) {
      var n = attrCount(info.attrRows);
      list.push({
        ok: n >= 3, must: false,
        text: '무엇이 들어 있는지 세 가지 이상 적었는가',
        hint: n >= 3 ? n + '가지를 적었습니다.' : '지금 ' + n + '가지. 세 가지 이상 적어 보세요.',
        screen: 'content'
      });
    }

    /* 7. 편향 */
    list.push({
      ok: len(get('bias')) >= 30, must: true,
      text: '빠지거나 치우친 것을 살펴보았는가',
      hint: len(get('bias')) >= 30
        ? '적었습니다.'
        : '이 데이터에 **들어 있지 않은 것**을 한 가지라도 찾아 적어 주세요. 이 수업에서 가장 중요한 칸입니다.',
      screen: 'content'
    });

    /* 8. 활동 */
    var notDone = acts.filter(function (a) {
      var s = scores[a.key];
      return !(s && s.a);
    });
    list.push({
      ok: notDone.length === 0, must: false,
      text: '연습 활동을 모두 해 보았는가',
      hint: notDone.length
        ? '아직 안 한 활동 — ' + notDone.map(function (a) { return a.label; }).join(', ')
        : '모두 해 보았습니다.',
      screen: null
    });

    /* 9. 뭉뚱그린 표현 */
    var vagueIn = [];
    fields.forEach(function (f) {
      if (f.min < 30) return;                 /* 짧은 칸은 보지 않는다 */
      if (vague(get(f.key)).length) vagueIn.push(f.no + ' ' + f.title);
    });
    list.push({
      ok: vagueIn.length === 0, must: false,
      text: '뭉뚱그린 표현을 구체적으로 바꾸었는가',
      hint: vagueIn.length ? '살펴볼 칸 — ' + vagueIn.join(', ') : '괜찮습니다.',
      screen: null
    });

    return list;
  }

  /** 어떤 화면에서 그 칸을 쓰는지 찾는다 */
  function screenOf(key, info) {
    var map = (info && info.screenFields) || (typeof DATA !== 'undefined' ? DATA.screenFields : null) || {};
    var found = null;
    Object.keys(map).forEach(function (sid) {
      if (found) return;
      if ((map[sid] || []).indexOf(key) >= 0) found = sid;
    });
    return found;
  }

  /** 점검 목록에서 「반드시 고쳐야 할 것」의 수 */
  function mustLeft(list) {
    return (list || []).filter(function (c) { return c.must && !c.ok; }).length;
  }

  return {
    len: len, vague: vague, url: url,
    guessType: guessType, typeMismatch: typeMismatch,
    needsAttrs: needsAttrs, attrPromptOf: attrPromptOf, attrText: attrText, attrCount: attrCount,
    scaleBadges: scaleBadges, problemBadges: problemBadges, whyBadges: whyBadges,
    checklist: checklist, screenOf: screenOf, mustLeft: mustLeft
  };
})();
</script>

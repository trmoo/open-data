<!--
  공공데이터 수집 기록장 — 로그인 · 화면 이동 · 서버 통신
  © 2026 티쳐무 · 모든 권리 보유

  ⚠ 로그인 정보는 sessionStorage 에만 담는다. [나가기] 를 누르면 작성 기록까지 함께 지운다
     (컴퓨터실에서 다음 학생에게 앞 학생 답이 보이면 안 되기 때문).
-->
<script>
var APP = {
  boot: (typeof BOOT_DATA !== 'undefined') ? BOOT_DATA
        : { fields: [], activities: [], tabs: [], totalMax: 0, steps: 1 },
  state: { token: '', sid: '', name: '', submitted: '' },
  tab: 1, screen: null
};

var SS_KEY = 'opendata.session';

/* ── 서버 부르기 ───────────────────────────────────────── */
function callServer(fn, args, cb) {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    var runner = google.script.run
      .withSuccessHandler(function (r) { cb(r); })
      .withFailureHandler(function (e) {
        cb({ ok: false, msg: '서버와 이야기하지 못했습니다: ' + (e && e.message ? e.message : e) });
      });
    runner[fn].apply(runner, args);
  } else if (typeof FAKE_SERVER !== 'undefined') {
    setTimeout(function () {
      try { cb(FAKE_SERVER(fn, args)); }
      catch (e) { cb({ ok: false, msg: String(e && e.message || e) }); }
    }, 40);
  } else {
    cb({ ok: false, msg: '미리보기 모드에서는 저장할 수 없습니다.' });
  }
}

/* ── 자동 저장 ─────────────────────────────────────────── */
var saveTimer = null, saveFlag = null;
function flagSave(text, cls) {
  if (!saveFlag) return;
  saveFlag.textContent = text;
  saveFlag.style.color = cls === 'bad' ? '#ffd7d7' : '';
}

APP.payload = function () {
  return { v: 1, vals: STORE.vals, scores: STORE.scores, answers: STORE.answers };
};

APP.save = function (now, cb) {
  if (!APP.state.token) { if (cb) cb({ ok: false }); return; }
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
  var go = function () {
    flagSave('저장하는 중…');
    callServer('apiSave', [APP.state.token, APP.payload()], function (r) {
      if (r && r.ok) { STORE.dirty = false; flagSave('저장됨'); }
      else if (r && r.expired) { flagSave('로그인 만료', 'bad'); showGate('로그인이 풀렸습니다. 다시 들어와 주세요.'); }
      else flagSave('저장 실패', 'bad');
      cacheLocal();
      if (cb) cb(r);
    });
  };
  if (now) go(); else saveTimer = setTimeout(go, 2500);
};

STORE.onChange = function () {
  flagSave('저장 대기…');
  cacheLocal();
  APP.save(false);
  paintNav();
};

/** 새로 고침을 눌러도 잃지 않게 이 브라우저에도 잠깐 담아 둔다 */
function cacheLocal() {
  try {
    sessionStorage.setItem(SS_KEY, JSON.stringify({
      token: APP.state.token, sid: APP.state.sid, name: APP.state.name,
      submitted: APP.state.submitted,
      vals: STORE.vals, scores: STORE.scores, answers: STORE.answers
    }));
  } catch (e) { /* 저장 공간이 없으면 그냥 넘어간다 */ }
}

function readLocal() {
  try { return JSON.parse(sessionStorage.getItem(SS_KEY) || 'null'); }
  catch (e) { return null; }
}

APP.submit = function (cb) {
  callServer('apiSubmit', [APP.state.token, APP.payload()], function (r) {
    if (r && r.ok) { APP.state.submitted = r.at; cacheLocal(); }
    if (cb) cb(r);
  });
};

APP.logout = function () {
  /* ⚠ 방금 쓴 글이 아직 2.5초 대기 중일 수 있다 — 지우기 전에 먼저 저장을 끝낸다.
     이걸 빼면 다 쓰자마자 [나가기] 를 누른 학생의 마지막 몇 줄이 사라진다. */
  var wipe = function () {
    var tk = APP.state.token;
    try { sessionStorage.removeItem(SS_KEY); } catch (e) {}
    STORE.vals = {}; STORE.answers = {}; STORE.scores = {}; STORE.dirty = false;
    APP.state = { token: '', sid: '', name: '', submitted: '' };
    callServer('apiLogout', [tk], function () {});
    showGate('나왔습니다. 다시 들어오려면 학번을 적어 주세요.');
  };

  ask('나가기', '로그인 정보와 <b>이 컴퓨터에 남은 작성 기록</b>이 함께 지워집니다.<br>' +
                '선생님 시트에 저장된 내용은 그대로 남습니다.', function () {
    if (STORE.dirty && APP.state.token) {
      flagSave('저장하는 중…');
      APP.save(true, function (r) {
        if (r && !r.ok && !r.expired) {
          ask('저장하지 못했습니다', '마지막에 쓴 내용을 서버에 보내지 못했습니다.<br>' +
                                    '그래도 나가면 그 내용이 사라질 수 있습니다.',
              wipe, '그래도 나가기');
          return;
        }
        wipe();
      });
      return;
    }
    wipe();
  }, '나가기');
};

APP.changePw = function () {
  /* 창 한 번에 세 칸 — 브라우저 prompt 를 세 번 띄우면 크롬이 googleusercontent.com 주소를 붙여 보여 준다 */
  modal({
    title: '🔑 비밀번호 바꾸기',
    text: '새 비밀번호는 <b>네 글자 이상</b>으로 정해 주세요. 작성한 내용은 그대로 남습니다.',
    fields: [
      { key: 'old', label: '지금 쓰는 비밀번호', type: 'password', ph: '지금 비밀번호' },
      { key: 'nw',  label: '새 비밀번호',        type: 'password', ph: '네 글자 이상' },
      { key: 'nw2', label: '새 비밀번호 한 번 더', type: 'password', ph: '한 번 더' }
    ],
    ok: '바꾸기',
    onOk: function (v) {
      if (!v.old) return '지금 쓰는 비밀번호를 적어 주세요.';
      if (String(v.nw).length < 4) return '새 비밀번호는 네 글자 이상으로 정해 주세요.';
      if (v.nw !== v.nw2) return '두 번 적은 새 비밀번호가 다릅니다.';
      callServer('apiChangePw', [APP.state.token, v.old, v.nw], function (r) {
        if (r && r.ok) toast('비밀번호를 바꾸었습니다.');
        else say('바꾸지 못했습니다', (r && r.msg) || '잠시 뒤에 다시 해 보세요.');
      });
    }
  });
};

/* ── 로그인 화면 ───────────────────────────────────────── */
var GATE = null, MAIN = null, NAV = null, PILLS = null, BODY = null, WHO = null;

function showGate(msg) {
  MAIN.style.display = 'none';
  NAV.style.display = 'none';
  PILLS.style.display = 'none';
  clear(WHO);
  GATE.style.display = '';
  clear(GATE);

  var step = 'sid', sid = '', masked = '';
  var err = h('div.err');
  var body = h('div');

  function fail(t) { err.textContent = t; err.classList.add('show'); }
  function ok() { err.classList.remove('show'); }

  function paint() {
    clear(body);
    if (step === 'sid') {
      var input = h('input', { type: 'tel', inputmode: 'numeric', placeholder: '예: 20315',
        'aria-label': '학번', value: sid });
      var go = function () {
        ok();
        var v = String(input.value || '').replace(/\D/g, '');
        if (v.length < 4) { fail('학번은 숫자 4~5자리로 적어 주세요.'); return; }
        btn.disabled = true; btn.textContent = '확인하는 중…';
        callServer('apiLookup', [v], function (r) {
          btn.disabled = false; btn.textContent = '다음';
          if (!r || !r.ok) { fail((r && r.msg) || '확인하지 못했습니다.'); return; }
          sid = r.sid; masked = r.masked || '';
          step = (r.state === 'known') ? 'pw' : 'reg';
          paint();
        });
      };
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
      var btn = h('button.btn', { type: 'button', onclick: go }, '다음');
      body.appendChild(h('label', '학번'));
      body.appendChild(input);
      body.appendChild(btn);
      setTimeout(function () { input.focus(); }, 60);

    } else if (step === 'pw') {
      var pw = h('input', { type: 'password', placeholder: '비밀번호', 'aria-label': '비밀번호' });
      var go2 = function () {
        ok();
        if (!pw.value) { fail('비밀번호를 적어 주세요.'); return; }
        b2.disabled = true; b2.textContent = '들어가는 중…';
        callServer('apiLogin', [sid, pw.value], function (r) {
          b2.disabled = false; b2.textContent = '들어가기';
          if (!r || !r.ok) {
            if (r && r.state) { step = 'reg'; paint(); fail(r.msg); return; }
            fail((r && r.msg) || '들어가지 못했습니다.'); return;
          }
          enter(r);
        });
      };
      pw.addEventListener('keydown', function (e) { if (e.key === 'Enter') go2(); });
      var b2 = h('button.btn', { type: 'button', onclick: go2 }, '들어가기');
      body.appendChild(h('p.small.center', { html: '학번 <b>' + sid + '</b> · ' + (masked || '') }));
      body.appendChild(h('label', '비밀번호'));
      body.appendChild(pw);
      body.appendChild(b2);
      body.appendChild(h('button.back', { type: 'button', onclick: function () { step = 'sid'; ok(); paint(); } },
        '학번을 다시 적기'));
      body.appendChild(h('p.small.center', { style: 'margin-top:10px' },
        '비밀번호를 잊었으면 선생님께 말씀해 주세요. 초기화해 주시면 작성한 내용은 그대로 두고 새로 정할 수 있습니다.'));
      setTimeout(function () { pw.focus(); }, 60);

    } else {
      var nm = h('input', { type: 'text', placeholder: '이름', 'aria-label': '이름' });
      var p1 = h('input', { type: 'password', placeholder: '비밀번호 (네 글자 이상)', 'aria-label': '비밀번호' });
      var p2 = h('input', { type: 'password', placeholder: '비밀번호 한 번 더', 'aria-label': '비밀번호 확인' });
      var go3 = function () {
        ok();
        if (String(nm.value || '').replace(/\s/g, '').length < 2) { fail('이름을 두 글자 이상 적어 주세요.'); return; }
        if (String(p1.value).length < 4) { fail('비밀번호는 네 글자 이상으로 정해 주세요.'); return; }
        if (p1.value !== p2.value) { fail('두 번 적은 비밀번호가 다릅니다.'); return; }
        b3.disabled = true; b3.textContent = '시작하는 중…';
        callServer('apiRegister', [sid, nm.value, p1.value], function (r) {
          b3.disabled = false; b3.textContent = '시작하기';
          if (!r || !r.ok) { fail((r && r.msg) || '시작하지 못했습니다.'); return; }
          enter(r);
        });
      };
      p2.addEventListener('keydown', function (e) { if (e.key === 'Enter') go3(); });
      var b3 = h('button.btn', { type: 'button', onclick: go3 }, '시작하기');
      body.appendChild(h('p.small.center', { html: masked
        ? '학번 <b>' + sid + '</b> · ' + masked + ' — 비밀번호를 새로 정해 주세요.'
        : '학번 <b>' + sid + '</b> · 처음 오셨네요. 이름과 비밀번호를 정해 주세요.' }));
      body.appendChild(h('label', '이름'));
      body.appendChild(nm);
      body.appendChild(h('label', '비밀번호'));
      body.appendChild(p1);
      body.appendChild(h('label', '비밀번호 한 번 더'));
      body.appendChild(p2);
      body.appendChild(b3);
      body.appendChild(h('button.back', { type: 'button', onclick: function () { step = 'sid'; ok(); paint(); } },
        '학번을 다시 적기'));
      setTimeout(function () { nm.focus(); }, 60);
    }
  }

  GATE.appendChild(h('h2', '공공데이터 수집 기록장'));
  GATE.appendChild(h('p.lead', '공공·민간 데이터를 찾아보고, 수집한 데이터의 기본 정보를 기록합니다.'));
  if (msg) GATE.appendChild(h('div.tip', msg));
  GATE.appendChild(body);
  GATE.appendChild(err);
  GATE.appendChild(h('p.small.center', { style: 'margin-top:16px' },
    '학번과 이름만 씁니다. 비밀번호는 알아볼 수 없는 형태(해시)로만 저장되어 선생님도 볼 수 없습니다.'));
  paint();
}

function enter(r) {
  APP.state.token = r.token;
  APP.state.sid = r.sid;
  APP.state.name = r.name;
  APP.state.submitted = r.submitted || '';
  if (r.data) {
    STORE.vals = r.data.vals || {};
    STORE.scores = r.data.scores || {};
    STORE.answers = r.data.answers || {};
  }
  cacheLocal();
  GATE.style.display = 'none';
  MAIN.style.display = '';
  NAV.style.display = '';
  PILLS.style.display = '';
  paintWho();
  paintNav();
  syncTopHeight();                 /* 머리말에 학번·이름이 들어가 높이가 바뀐다 */
  var want = (location.hash || '').replace('#', '');
  showScreen(findScreen(want) ? want : (visibleScreens()[0] || SCREENS[0]).id);
}

/* ── 머리말 높이 알려 주기 ──────────────────────────────────
   머리말(.top)과 탭 막대(.tabs)가 둘 다 sticky 이므로, 탭을 머리말 높이만큼 내려 붙여야 한다.
   머리말은 글자 수·창 너비에 따라 한 줄에서 세 줄까지 늘어나므로 실제 높이를 재서 CSS 변수로 넘긴다.
   ⚠ 이 리스너는 화면(s1·s2)이 아니라 앱 전체 수명이라 여기서 직접 걸어도 된다. */
function syncTopHeight() {
  var top = document.querySelector('.top');
  if (!top) return;
  var px = Math.round(top.getBoundingClientRect().height);
  if (px > 0) document.documentElement.style.setProperty('--top-h', px + 'px');
}

/* ── 머리말 ─────────────────────────────────────────────── */
function paintWho() {
  clear(WHO);
  WHO.appendChild(h('span', { html: '<b>' + APP.state.sid + '</b> ' + APP.state.name }));
  WHO.appendChild(h('span.wprog', progressPct() + '%'));
  saveFlag = h('span.saveflag', '저장됨');
  WHO.appendChild(saveFlag);
  WHO.appendChild(h('button.chip', { type: 'button', onclick: function () { showScreen('report'); } }, '내 활동지'));
  WHO.appendChild(h('button.chip', { type: 'button', onclick: function () { APP.changePw(); } }, '🔑'));
  WHO.appendChild(h('button.chip', { type: 'button', onclick: function () { APP.logout(); } }, '나가기'));
}

/* ── 탭·알약 ────────────────────────────────────────────── */
/** 이번 차시에 열린 화면만 */
function visibleScreens() {
  return SCREENS.filter(function (s) { return inCourse(s.id); });
}

function findScreen(id) {
  var v = visibleScreens();
  for (var i = 0; i < v.length; i++) if (v[i].id === id) return v[i];
  return null;
}

/** 알약에 붙는 점 — 다 했으면 초록, 하던 중이면 노랑 */
function screenState(id) {
  var acts = (DATA.screenActs && DATA.screenActs[id]) || [];
  var flds = (DATA.screenFields && DATA.screenFields[id]) || [];
  if (!acts.length && !flds.length) return '';
  var doneAll = true, any = false;
  acts.forEach(function (k) {
    var a = actOf(k), s = getScore(k);
    if (s.a) any = true;
    if (s.g < a.max) doneAll = false;
  });
  flds.forEach(function (k) {
    var n = JUDGE.len(getVal(k));
    if (n > 0) any = true;
    if (n < fieldOf(k).min) doneAll = false;
  });
  if (doneAll) return 'done';
  if (any) return 'part';
  return '';
}

function paintNav() {
  clear(NAV); clear(PILLS);
  var vis = visibleScreens();
  (APP.boot.tabs || []).forEach(function (tb) {
    if (!vis.filter(function (s) { return s.tab === tb.no; }).length) return;   /* 빈 탭은 숨긴다 */
    var b = h('button.tab' + (tb.no === APP.tab ? '.on' : ''), { type: 'button', onclick: function () {
      APP.tab = tb.no;
      var first = vis.filter(function (s) { return s.tab === tb.no; })[0];
      if (first) showScreen(first.id);
    } }, tb.name);
    var t = tabScore(tb.no);
    if (t.max) b.appendChild(h('span.mini', t.got + '/' + t.max));
    NAV.appendChild(b);
  });

  vis.filter(function (s) { return s.tab === APP.tab; }).forEach(function (s) {
    var st = screenState(s.id);
    var b = h('button.pill' + (s.id === APP.screen ? '.on' : '') + (st ? '.' + st : ''),
      { type: 'button', onclick: function () { showScreen(s.id); } });
    b.appendChild(h('span.dot'));
    add(b, s.title);
    PILLS.appendChild(b);
  });

  if (APP.state.token && WHO.children.length > 1) {
    WHO.children[1].textContent = progressPct() + '%';
  }
}

function showScreen(id) {
  var s = findScreen(id);
  if (!s) s = visibleScreens()[0] || SCREENS[0];
  endScreen();                        /* 앞 화면이 걸어 둔 타이머·리스너를 걷어 낸다 */
  APP.screen = s.id;
  APP.tab = s.tab;
  if (location.hash !== '#' + s.id) {
    try { history.replaceState(null, '', '#' + s.id); } catch (e) { location.hash = s.id; }
  }
  clear(BODY);
  paintNav();
  try {
    s.render(BODY);
  } catch (e) {
    BODY.appendChild(h('div.card', [
      h('h2', '이 화면을 그리지 못했습니다'),
      h('p', '다른 화면을 눌러 보시고, 계속 이러면 선생님께 알려 주세요.'),
      h('div.log', String(e && e.stack || e))
    ]));
  }
  BODY.appendChild(nextRow());
  window.scrollTo(0, 0);
}

/** 화면 아래 「앞·다음 화면으로」 */
function nextRow() {
  var vis = visibleScreens();
  var at = -1;
  for (var i = 0; i < vis.length; i++) if (vis[i].id === APP.screen) at = i;
  var row = h('div.row.navrow');
  if (at > 0) {
    row.appendChild(h('button.btn.gray', { type: 'button', onclick: function () {
      showScreen(vis[at - 1].id);
    } }, '← ' + vis[at - 1].title));
  } else {
    row.appendChild(h('span.grow'));
  }
  if (at >= 0 && at < vis.length - 1) {
    row.appendChild(h('span.grow'));
    row.appendChild(h('button.btn', { type: 'button', onclick: function () {
      showScreen(vis[at + 1].id);
    } }, vis[at + 1].title + ' →'));
  }
  return row;
}

/* ── 시작 ───────────────────────────────────────────────── */
function startApp() {
  GATE  = document.getElementById('gate');
  MAIN  = document.getElementById('main');
  NAV   = document.getElementById('tabs');
  PILLS = document.getElementById('pills');
  BODY  = document.getElementById('body');
  WHO   = document.getElementById('who');

  (APP.boot.activities || []).forEach(function (a) { STORE.acts[a.key] = a; });
  (APP.boot.fields || []).forEach(function (f) { STORE.fields[f.key] = f; });
  STORE.course = APP.boot.course || null;      /* 이번 차시에 열어 줄 범위 */

  window.addEventListener('hashchange', function () {
    var id = (location.hash || '').replace('#', '');
    if (id && id !== APP.screen && findScreen(id)) showScreen(id);
  });
  window.addEventListener('beforeunload', function () {
    if (STORE.dirty && APP.state.token) APP.save(true);
  });
  /* 창 크기가 바뀌면 머리말이 줄바꿈되어 높이가 달라진다 — 탭이 가려지지 않게 다시 잰다 */
  window.addEventListener('resize', syncTopHeight);
  syncTopHeight();

  var cached = readLocal();
  if (cached && cached.token) {
    STORE.vals = cached.vals || {};
    STORE.scores = cached.scores || {};
    STORE.answers = cached.answers || {};
    callServer('apiLoad', [cached.token], function (r) {
      if (r && r.ok) {
        enter({ token: cached.token, sid: cached.sid, name: cached.name,
                submitted: r.submitted,
                data: r.data || { vals: STORE.vals, scores: STORE.scores, answers: STORE.answers } });
      } else {
        showGate('로그인이 풀렸습니다. 학번을 다시 적어 주세요.');
      }
    });
  } else {
    showGate('');
  }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', startApp);
else startApp();
</script>
